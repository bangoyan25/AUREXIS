# ═══════════════════════════════════════════════════════════════════════
# Nginx Virtual Host for web.aurexis.web.id (AUREXIS Frontend)
# Location on Linux VPS: /etc/nginx/sites-available/web.aurexis.web.id
# Enable via: sudo ln -s /etc/nginx/sites-available/web.aurexis.web.id /etc/nginx/sites-enabled/
# ═══════════════════════════════════════════════════════════════════════

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name web.aurexis.web.id;

    # Allow Let's Encrypt / Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name web.aurexis.web.id;

    # SSL certificates (issued via certbot --nginx -d web.aurexis.web.id)
    ssl_certificate /etc/letsencrypt/live/web.aurexis.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.aurexis.web.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://app.aurexis.web.id wss://app.aurexis.web.id;" always;

    # Proxy to Next.js node application server running locally on 127.0.0.1:3000
    # NOTE: /_next/static/ is served by Next.js itself (which runs as ubuntu user
    # and has full access to its own build output). Serving via Nginx alias caused
    # 403 Permission Denied because www-data cannot traverse /home/ubuntu (mode 750).
    # Next.js sets Cache-Control: public, max-age=31536000, immutable on /_next/static/
    # automatically, so no separate Nginx static-file block is needed.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
